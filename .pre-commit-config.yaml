fail_fast: true
default_install_hook_types:
  - commit-msg
  - pre-commit
  - pre-push
repos:
  - repo: https://git.cisdigital.cn/specification/java-specification/big-data-specification/elite-forge-precommit-hooks
    rev: 1.0.0
    hooks:
      - id: spotless-check
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: check-json
      - id: check-xml
      - id: check-yaml
      - id: check-commit-msg
      - id: check-feature-merge-to-nightly
